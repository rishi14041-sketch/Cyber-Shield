{% extends 'base.html' %}{% block content %}<header><h1>{{title}}</h1></header><section class="panel"><table><tr><th>Name</th><th>Type</th><th>IP</th><th>Owner</th><th>Department</th><th>Criticality</th><th>Risk</th></tr>{% for a in assets.items %}<tr><td>{{a.name}}</td><td>{{a.asset_type}}</td><td class="mono">{{a.ip_address}}</td><td>{{a.owner}}</td><td>{{a.department.name if a.department else '—'}}</td><td>{{a.criticality}}</td><td><span class="badge {{a.risk_level|lower}}">{{a.risk_level}}</span></td></tr>{% endfor %}</table></section>{% endblock %}
