{% extends 'base.html' %}{% block content %}<header><h1>{{title}}</h1></header><form class="filters"><input name="q" placeholder="Search log messages"><select name="severity"><option value="">All severity</option><option>Info</option><option>Warning</option><option>High</option><option>Critical</option></select><button>Filter</button></form><section class="panel"><table><tr><th>Time</th><th>Type</th><th>Severity</th><th>Source</th><th>Message</th></tr>{% for l in logs.items %}<tr><td>{{l.event_time.strftime('%Y-%m-%d %H:%M:%S')}}</td><td>{{l.log_type}}</td><td><span class="badge {{l.severity|lower}}">{{l.severity}}</span></td><td>{{l.source}}</td><td>{{l.message}}</td></tr>{% endfor %}</table></section>{% endblock %}
