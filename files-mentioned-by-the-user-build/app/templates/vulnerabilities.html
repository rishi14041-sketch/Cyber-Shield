{% extends 'base.html' %}{% block content %}<header><h1>{{title}}</h1></header><section class="panel"><table><tr><th>CVE</th><th>CVSS</th><th>Asset</th><th>Risk</th><th>Patch</th><th>Deadline</th></tr>{% for v in vulnerabilities.items %}<tr><td>{{v.cve_id}}</td><td>{{v.cvss_score}}</td><td>{{v.asset.name if v.asset else 'Unassigned'}}</td><td><span class="badge {{v.risk_level|lower}}">{{v.risk_level}}</span></td><td>{{v.patch_status}}</td><td>{{v.remediation_deadline or '—'}}</td></tr>{% endfor %}</table></section>{% endblock %}
