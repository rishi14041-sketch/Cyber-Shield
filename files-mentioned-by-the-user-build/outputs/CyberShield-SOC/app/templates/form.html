{% extends 'base.html' %}{% block content %}<header><h1>{{title}}</h1></header><section class="panel form-panel"><form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %}>{{form.hidden_tag()}}{% for field in form if field.type not in ['CSRFTokenField','SubmitField'] %}<label>{{field.label}}{{field()}}{% for e in field.errors %}<small class="error">{{e}}</small>{% endfor %}</label>{% endfor %}{% if multipart %}<label>Evidence upload<input type="file" name="evidence"></label>{% endif %}{{form.submit(class_='primary')}}</form></section>{% endblock %}
